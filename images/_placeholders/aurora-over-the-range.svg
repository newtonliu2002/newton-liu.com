  <path d="M0 594 L400 648 L800 702 L1200 756 L1600 594 L1600 900 L0 900 Z"
        fill="#060b0e"/>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>

  <text x="800" y="846" fill="#ffffff" fill-opacity="0.22"
        font-family="Georgia, serif" font-size="19" font-style="italic"
        text-anchor="middle">placeholder</text>
