<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0d1a22"/>
      <stop offset="72%" stop-color="#2f7a6b"/>
    </linearGradient>
    <radialGradient id="glow" cx="71%" cy="44%" r="55%">
      <stop offset="0%" stop-color="#a8f0d0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#a8f0d0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="1136" cy="396" r="50" fill="#a8f0d0" opacity="0.55"/>

  <path d="M0 477 L400 531 L800 585 L1200 639 L1600 477 L1600 900 L0 900 Z"
