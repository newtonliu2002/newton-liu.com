<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#3b2d26"/>
      <stop offset="72%" stop-color="#c07a44"/>
    </linearGradient>
    <radialGradient id="glow" cx="48%" cy="32%" r="55%">
      <stop offset="0%" stop-color="#ffe1b0" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffe1b0" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>
  <rect width="1600" height="900" fill="url(#glow)"/>
  <circle cx="768" cy="288" r="50" fill="#ffe1b0" opacity="0.55"/>

  <path d="M0 585 L400 639 L800 477 L1200 531 L1600 585 L1600 900 L0 900 Z"
        fill="#150e09" opacity="0.55"/>
  <path d="M0 702 L400 756 L800 594 L1200 648 L1600 702 L1600 900 L0 900 Z"
        fill="#150e09"/>

  <rect width="1600" height="900" fill="url(#vig)"/>
  <rect width="1600" height="900" filter="url(#grain)" opacity="0.05"/>

  <text x="800" y="846" fill="#ffffff" fill-opacity="0.22"
        font-family="Georgia, serif" font-size="19" font-style="italic"
        text-anchor="middle">placeholder</text>
</svg>
