<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#241a2e"/>
      <stop offset="72%" stop-color="#c2557a"/>
    </linearGradient>
    <radialGradient id="glow" cx="32%" cy="23%" r="55%">
      <stop offset="0%" stop-color="#ffd08a" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#ffd08a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#000" stop-opacity="0.35"/>
      <stop offset="45%" stop-color="#000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0.45"/>
    </linearGradient>
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3"/>
      <feColorMatrix type="saturate" values="0"/>
    </filter>
  </defs>

  <rect width="1600" height="1000" fill="url(#sky)"/>
  <rect width="1600" height="1000" fill="url(#glow)"/>
  <circle cx="512" cy="230" r="55" fill="#ffd08a" opacity="0.55"/>

  <path d="M0 590 L400 650 L800 710 L1200 530 L1600 590 L1600 1000 L0 1000 Z"
        fill="#0e0a13" opacity="0.55"/>
  <path d="M0 720 L400 780 L800 840 L1200 660 L1600 720 L1600 1000 L0 1000 Z"
        fill="#0e0a13"/>

  <rect width="1600" height="1000" fill="url(#vig)"/>
  <rect width="1600" height="1000" filter="url(#grain)" opacity="0.05"/>

  <text x="800" y="940" fill="#ffffff" fill-opacity="0.22"
        font-family="Georgia, serif" font-size="22" font-style="italic"
        text-anchor="middle">placeholder</text>
</svg>
