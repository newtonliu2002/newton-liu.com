<!-- GitHub Pages serves this page at ANY address with no file behind it,
     however deep (…/collections/nowhere/at/all), so before anything else:
     a page that has moved goes to its new address (MOVED: the old path from
     the site's root, with or without its trailing slash or index.html, then
     the new one; one line each), and then a <base> makes every relative
     link below start from the site's root wherever the visitor landed. The
     root is /newton-liu.com/ on the GitHub Pages address and / anywhere else,
     so a custom domain needs no change here. -->
<base href="https://newtonliu2002.github.io/newton-liu.com/">
<script>
(function () {
  var MOVED = {
    "collections/guangxi/": "collections/guangxi-guangdong/"
  };
  var path = location.pathname;
  var root = path.indexOf("/newton-liu.com/") === 0 ? "/newton-liu.com/" : "/";
  var rest = path.slice(root.length).replace(/index\.html$/, "").replace(/([^\/])$/, "$1/");
  if (Object.prototype.hasOwnProperty.call(MOVED, rest)) {
    // From this host's origin: a bare path would go by the <base> above.
    location.replace(location.origin + root + MOVED[rest] + location.search + location.hash);
    return;
  }
  // The <base> above is written in the markup so the browser's first look
  // ahead fetches the assets from the root too; here it gets this host's root.
  document.querySelector("base").setAttribute("href", root);
})();
</script>
